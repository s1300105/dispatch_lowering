[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctaudit"
version = "0.3.0"
description = "Pre-deployment static audit for cross-tool implicit (control-dependency) flows in LLM/MCP agents (CWE-1426)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "static-analysis",
    "taint-analysis",
    "llm-security",
    "agent-security",
    "implicit-flow",
    "CWE-1426",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]

# The core analyzer is intentionally stdlib-only: it parses and analyzes source
# with the standard `ast` module and needs nothing else to run in CI.
dependencies = []

[project.optional-dependencies]
# LLM triage backend (§4.6). Without this extra, the default offline MockTriage
# is used and the tool still runs end-to-end.
triage = ["anthropic>=0.39", "openai>=1.0"]
# Test suite.
dev = ["pytest>=7"]

[project.scripts]
ctaudit = "ctaudit.cli:main"
ctaudit-eval = "ctaudit.eval.__main__:main"
ctaudit-toolmodel = "ctaudit.toolmodel.cli:main"
ctaudit-annotate = "benchmark.annotate_cli:main"
ctaudit-flowbench = "benchmark.flow_bench:main"

[tool.setuptools]
packages = [
    "ctaudit",
    "ctaudit.models",
    "ctaudit.analysis",
    "ctaudit.triage",
    "ctaudit.eval",
    "ctaudit.toolmodel",
    "benchmark",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the suite imports the conftest helpers by module name
addopts = "-q"
